name: MedVision AI - Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript Code
        run: npx tsc -b

      - name: Run ESLint Checks
        run: npm run lint

      - name: Execute Vitest Unit Tests
        run: npx vitest run

      - name: Compile Production Bundle
        run: npm run build
